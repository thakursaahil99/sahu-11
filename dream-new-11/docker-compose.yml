# Full stack in Docker: PostgreSQL + API + admin panel.
#
#   cp .env.example .env            # then change the secrets
#   docker compose up -d --build    # API http://localhost:4000 · admin http://localhost:8080
#   docker compose --profile seed run --rm seed   # optional: demo accounts (APP_MODE=demo only)
#
# The mobile app isn't containerised — build it with EAS (see docs/DEPLOYMENT.md).

name: dream-new-11

x-api-env: &api-env
  # Inside the network the database is "db", not localhost:5433.
  DATABASE_URL: postgresql://${POSTGRES_USER:-dream11}:${POSTGRES_PASSWORD:-dream11}@db:5432/${POSTGRES_DB:-dream11}?schema=public
  UPLOAD_DIR: /data/uploads
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5174}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dream11}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dream11}
      POSTGRES_DB: ${POSTGRES_DB:-dream11}
      # UTF-8 for ₹ and names in Indian scripts; UTC so timestamps compare cleanly.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: migrate }
    env_file: .env
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: runtime }
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *api-env
      NODE_ENV: production
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - uploads:/data/uploads
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - '${ADMIN_PORT:-8080}:8080'
    depends_on:
      - api

  # Demo accounts (refuses to run unless APP_MODE=demo).
  seed:
    profiles: [seed]
    build: { context: ., dockerfile: apps/api/Dockerfile, target: migrate }
    env_file: .env
    environment: *api-env
    command: ['npx', 'prisma', 'db', 'seed']
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  uploads:
